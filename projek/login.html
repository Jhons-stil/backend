  <body class="login-page bg-body-secondary">
    <div class="login-box">
        <div class="login-logo">
            <div class="row">
                <div class="col-md-12">
                    <h1>
                        <i class="fa-brands fa-free-code-camp"></i>
                    </h1>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 text-secondary">
                    <b>PPW</b> Development
                </div>
            </div>
      </div>
      <!-- /.login-logo -->
      <div class="card">
        <div class="card-body login-card-body">
            <div class="row">
                <div class="col-md-12">
                    <p class="login-box-msg">Sign in to start your session</p>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    
                        <div class="input mb-3">
                            <div class="input-group">
                                <input type="email" class="form-control" placeholder="Email" id="inpEmail"/>
                                <div class="input-group-text"><span class="bi bi-envelope"></span></div>
                            </div>
                            <small id="smallEmail" class="text-danger">Silakan masukkan email</small>
                        </div>
                    
                    </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="input mb-3">
                        <div class="input-group">
                            <input type="password" class="form-control" placeholder="Password" id="inpPw"/>
                            <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
                        </div>
                        <small id="smallPw" class="text-danger">Silakan masukkan password</small>
                        <small id="smallNoValid" class="text-danger">Email atau password salah</small>
                    </div>
                </div>
            </div>
            <button id="masuk" class="btn btn-primary">Sign In</button>
        </div>
        <!-- /.login-card-body -->
      </div>
    </div>
